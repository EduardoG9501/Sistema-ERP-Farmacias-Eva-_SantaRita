name: Deploy ERP to Plesk

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente al hacer push a la rama main

jobs:
  build-and-deploy:
    runs-on: windows-latest  # Se ejecuta en servidores virtuales de GitHub

    steps:
    # 1. Obtener el código fuente del repositorio
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Configurar el SDK de .NET
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'  # Configura el compilador para .NET 10.0

    # 3. Restaurar dependencias y Compilar (Modo autónomo para Plesk IIS)
    - name: Build and Publish
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true -o ./publish

    # 4. Desplegar mediante FTP seguro a Plesk Shared Hosting
    - name: FTP Deploy to Plesk
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}      # IP o host FTP de tu Plesk (ej: ftp.neyvulgarinc.com)
        username: ${{ secrets.FTP_USERNAME }}  # Tu usuario FTP de Plesk
        password: ${{ secrets.FTP_PASSWORD }}  # Tu contraseña FTP de Plesk
        local-dir: ./publish/                  # Carpeta local que se compila y sube
        server-dir: /httpdocs/                 # Carpeta destino en Plesk
        dangerous-clean-slate: false           # Mantiene archivos estáticos como fotos de clientes subidos a Plesk
